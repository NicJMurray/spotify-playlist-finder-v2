name: Deploy Playlist Finder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playlist-finder-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: "22c1482ec05957092be7a2df424c4543"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Check deployment credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN as a repository secret before deploying."
            exit 1
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Build public assets
        run: npm run build
      - name: Compile Pages Functions
        run: npm run check:functions
      - name: Deploy existing Pages project
        run: npx --no-install wrangler pages deploy dist --project-name spotify-playlist-finder-v2 --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false
