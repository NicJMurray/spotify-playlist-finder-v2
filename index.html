<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Playlist Finder v2</title>
    <link rel="stylesheet" href="styles.css?v=20240927" />
  </head>
  <body>
    <header class="top-nav">
      <nav class="top-nav__inner">
        <a class="top-nav__link" href="https://njmurray.com/">Home</a>
      </nav>
    </header>
    <main class="app">
      <section class="app__hero">
        <h1 class="app__hero-heading">
          Spotify Playlist Finder
          <span class="app__hero-version">v2</span>
        </h1>
        <p>Enter up to eight search terms (artists or songs) and it will find matching Spotify playlists with that combination.</p>
      </section>

      <form id="search-form" class="search-form" autocomplete="off">
        <p class="search-form__help">Artist or song names (press Enter to search)</p>
        <div class="search-form__grid" data-terms></div>
        <div class="search-form__actions">
          <button type="submit" class="btn btn--spotify">Search</button>
          <div class="settings" data-settings>
            <button
              type="button"
              class="settings__toggle"
              data-settings-toggle
              aria-haspopup="true"
              aria-expanded="false"
            >
              Settings
              <span class="settings__chevron" aria-hidden="true">▾</span>
            </button>
            <div class="settings__menu" data-settings-menu hidden>
              <label class="settings__option">
                <input type="checkbox" data-setting="exclude-radio" />
                Exclude playlists with "Radio" in the title
              </label>
            </div>
          </div>
        </div>
      </form>

      <section id="results" class="results" hidden>
        <header class="results__header">
          <h2>Matched playlists</h2>
          <p class="results__summary" data-summary></p>
        </header>
        <div class="results__grid" data-results></div>
      </section>

      <section id="empty-state" class="empty" hidden>
        <p>No playlists found for that query just yet.</p>
      </section>
    </main>

    <template id="result-template">
      <article class="result">
        <a class="result__link" target="_blank" rel="noopener noreferrer"></a>
        <p class="result__snippet"></p>
      </article>
    </template>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
